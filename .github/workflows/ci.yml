name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: go test
        shell: bash
        # The race detector needs cgo; keep Windows on plain tests.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then go test -count=1 ./...; else go test -race -count=1 ./...; fi
      - name: Demo smoke test
        run: go run ./cmd/ciblame --demo --color never

  action:
    name: action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          since: 3d
