<text x="22.0" y="489" textLength="1084.2" lengthAdjust="spacingAndGlyphs" fill-opacity="0.55">MERGED = merged/total PRs · MIN/MERGE = CI minutes per merged PR, counting abandoned PRs · UNMERGED = minutes on PRs closed without merging</text>
<text x="22.0" y="508" textLength="998.4" lengthAdjust="spacingAndGlyphs" fill-opacity="0.55">Costs are estimates at GitHub list prices (Linux $0.006/min, Windows $0.010, macOS $0.062; larger runners scaled by core count).</text>
